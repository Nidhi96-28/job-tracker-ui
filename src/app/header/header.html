<header class="header">
  <a routerLink="/home" class="logo">Job Tracker</a>

  <div class="account">
    <button class="account-trigger" (click)="toggleDropdown()">
      <span class="initials">{{ (user()?.full_name ?? 'U').charAt(0) }}</span>
      <span class="name">{{ user()?.full_name ?? 'Account' }}</span>
      <span class="chevron" [class.open]="isOpen()">▾</span>
    </button>

    @if (isOpen()) {
      <div class="dropdown">
        <a routerLink="/edit-profile" class="dropdown-item" (click)="isOpen.set(false)">My account</a>
        <button class="dropdown-item" (click)="logout()">Logout</button>
      </div>
    }
  </div>
</header>
