<div class="min-h-screen w-full flex items-center justify-center ">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="w-full max-w-lg bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-xl font-semibold mb-4">Welcome back</h2>

    <label class="block text-sm text-gray-600 mb-1">Email</label>
    <input type="email" formControlName="email" placeholder="name@company.com"
      class="w-full border rounded-md px-3 py-2 mb-1 text-sm" />
    @if (loginForm.get('email')?.touched && loginForm.get('email')?.invalid) {
      <p class="text-red-500 text-xs mb-3">Enter a valid email</p>
    }

    <label class="block text-sm text-gray-600 mb-1">Password</label>
    <input type="password" formControlName="password" placeholder="••••••••"
      class="w-full border rounded-md px-3 py-2 mb-1 text-sm" />
    @if (loginForm.get('password')?.touched && loginForm.get('password')?.invalid) {
      <p class="text-red-500 text-xs mb-3">Password is required</p>
    }

    <button type="submit" [disabled]="loginForm.invalid"
      class="w-full bg-black text-white rounded-md py-2 text-sm disabled:opacity-40">
      Log in
    </button>

    <!-- @if (errorMessage) {
      <p class="text-red-500 text-xs mt-3">{{ errorMessage }}</p>
    } -->

    <p class="text-sm text-gray-500 mt-4 text-center">
      Don't have an account?
      <a routerLink="/signup" class="text-black underline">Sign up</a>
    </p>
  </form>
</div>
